# يزور قاعدة البيانات مرة باليوم عشان Supabase المجاني ما يوقف المشروع
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *' # كل يوم الساعة 6:17 الصبح بتوقيت الرياض
  workflow_dispatch: # تقدر تشغله يدوي من صفحة Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::أضف SUPABASE_URL و SUPABASE_PUBLISHABLE_KEY في Settings > Secrets and variables > Actions"
            exit 1
          fi
          URL="${SUPABASE_URL%/}"
          URL="${URL%/rest/v1}"
          curl -fsS --retry 3 --retry-delay 10 \
            "$URL/rest/v1/cities?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -o /dev/null
          echo "Supabase شغال ✅"
